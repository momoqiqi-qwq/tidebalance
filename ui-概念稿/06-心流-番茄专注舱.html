<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>心流 · 番茄专注舱</title>
<style>
  :root{
    --bg1:#0E1F1A; --bg2:#16342C; --glow:#7FE8B2; --ink:#F4F7F5; --ink-2:#9DB8AC;
    --amber:#FFB454; --dim:#2A4A40;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1440px;height:900px;overflow:hidden;color:var(--ink);
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    background:radial-gradient(1100px 700px at 50% 38%, #1C4437 0%, var(--bg2) 45%, var(--bg1) 100%)}
  .app{position:relative;height:900px;display:flex;flex-direction:column;align-items:center}

  .top{width:100%;display:flex;align-items:center;justify-content:space-between;padding:24px 36px}
  .logo{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.24em;font-weight:600}
  .logo .leaf{width:24px;height:24px;border-radius:50%;background:var(--glow);opacity:.9}
  .quit{font-size:13px;color:var(--ink-2);border:1px solid rgba(157,184,172,.35);border-radius:20px;padding:7px 18px}

  .task{margin-top:26px;text-align:center}
  .task .kicker{font-size:12px;letter-spacing:.3em;color:var(--ink-2);margin-bottom:12px}
  .task h1{font-size:26px;font-weight:600;letter-spacing:.02em}
  .task h1 em{font-style:normal;color:var(--amber)}
  .task .note{font-size:13px;color:var(--ink-2);margin-top:10px}

  /* 大环 */
  .stage{position:relative;margin-top:34px;width:390px;height:390px}
  .ticks{position:absolute;inset:0;border-radius:50%;
    background:repeating-conic-gradient(rgba(127,232,178,.28) 0 .5deg, transparent .5deg 7.5deg);
    -webkit-mask:radial-gradient(circle, transparent 62%, #000 63%, #000 66%, transparent 67%);}
  .arc{position:absolute;inset:34px;border-radius:50%;
    background:conic-gradient(var(--glow) 0 262deg, rgba(127,232,178,.12) 262deg 360deg);
    -webkit-mask:radial-gradient(circle, transparent 70%, #000 71%);}
  .arc::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--glow);
    -webkit-mask:radial-gradient(circle, transparent calc(100% - 7px), #000 calc(100% - 6px));
    transform:rotate(262deg);transform-origin:center}
  .inner{position:absolute;inset:64px;border-radius:50%;background:rgba(10,26,21,.55);
    border:1px solid rgba(127,232,178,.18);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .inner .time{font-size:64px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .inner .lbl{font-size:12px;letter-spacing:.28em;color:var(--ink-2);margin-top:8px}
  .modes{position:absolute;bottom:-54px;left:0;right:0;display:flex;justify-content:center;gap:10px}
  .mode{font-size:12.5px;border-radius:20px;padding:8px 20px;color:var(--ink-2);border:1px solid rgba(157,184,172,.3)}
  .mode.on{background:var(--glow);color:#0E1F1A;border-color:var(--glow);font-weight:600}

  /* 底部 */
  .sessions{margin-top:96px;display:flex;align-items:center;gap:14px}
  .sdot{width:12px;height:12px;border-radius:50%;background:var(--dim)}
  .sdot.f{background:var(--glow);box-shadow:0 0 12px rgba(127,232,178,.7)}
  .sdot.n{border:1.5px solid var(--ink-2);background:transparent}
  .sessions .cap{font-size:12.5px;color:var(--ink-2);margin-left:8px}

  .ctrl{margin-top:26px;display:flex;gap:14px}
  .big{width:180px;height:52px;border-radius:26px;background:var(--glow);color:#0E1F1A;font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:center;letter-spacing:.1em}
  .small{width:52px;height:52px;border-radius:50%;border:1px solid rgba(157,184,172,.35);color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;font-size:17px}

  .stats{position:absolute;bottom:30px;left:0;right:0;display:flex;justify-content:center;gap:56px;text-align:center}
  .st b{font-size:19px;font-weight:600;display:block;font-variant-numeric:tabular-nums}
  .st span{font-size:11.5px;color:var(--ink-2)}
  .corner{position:absolute;font-size:12.5px;color:var(--ink-2)}
  .corner.r{right:36px;bottom:34px;text-align:right}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo"><span class="leaf"></span>心 流</div>
    <div class="quit">结束专注 ESC</div>
  </div>

  <div class="task">
    <div class="kicker">第 2 个番茄 · 本轮共 4 个</div>
    <h1>写毕业论文 · <em>3.2 实验设计</em></h1>
    <div class="note">手机已静音 · 屏蔽了 12 个网站的打扰</div>
  </div>

  <div class="stage">
    <div class="ticks"></div>
    <div class="arc"></div>
    <div class="inner">
      <div class="time">18:42</div>
      <div class="lbl">保 持 在 线</div>
    </div>
    <div class="modes">
      <span class="mode on">专注 25</span><span class="mode">短休 5</span><span class="mode">长休 15</span>
    </div>
  </div>

  <div class="sessions">
    <span class="sdot f"></span><span class="sdot f"></span><span class="sdot n"></span><span class="sdot n"></span>
    <span class="cap">完成 4 个进入长休 · 起身接杯水</span>
  </div>

  <div class="ctrl">
    <div class="big">暂 停</div>
    <div class="small">✓</div>
    <div class="small">✕</div>
  </div>

  <div class="stats">
    <div class="st"><b>10</b><span>今日番茄</span></div>
    <div class="st"><b>4h 10m</b><span>今日专注</span></div>
    <div class="st"><b>5 天</b><span>连续达标</span></div>
    <div class="st"><b>52m</b><span>今天最长一次</span></div>
  </div>

  <div class="corner r">背景音：林间雨声 ▸ 换一个</div>
</div>
</body>
</html>
