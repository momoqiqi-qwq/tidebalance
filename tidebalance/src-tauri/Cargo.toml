[package]
name = "tidebalance"
version = "0.1.0"
description = "潮衡 · 时间块与四象限"
authors = ["yile"]
edition = "2021"

[lib]
name = "tidebalance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "gzip", "cookies"] }
des = "0.8"
ecb = "0.1"
hex = "0.4"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
strip = true
